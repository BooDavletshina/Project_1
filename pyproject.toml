[project]
name = "project-1"
version = "0.1.0"
description = ""
authors = [
    {name = "Lyubov Davletshina",email = "chernonosova.lyubov@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "black (>=25.12.0,<26.0.0)",
    "mypy (>=1.19.0,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line_length = 119
exclude = 'git'

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.19.0"
isort = "^7.0.0"

